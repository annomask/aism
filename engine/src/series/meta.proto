syntax = "proto3";

package meta;

message Series {
  string key = 1;
  repeated Tag tags = 2;
}

message Tag {
  string key = 1;
  string value = 2;
}

message MeasurementFields {
    bytes name = 1;
    repeated Field fields = 2;
}

message Field {
    bytes name = 1;
    sint32 typ = 2;
    uint32 id = 3;
}

message MeasurementFieldSet {
    repeated MeasurementFields measurements = 1;
}

message MeasurementSchemaRegistryEnvelope {
    uint32 schema_version = 1;
    bool legacy_bootstrap_complete = 2;
    repeated MeasurementSchemaEntry measurements = 3;
}

message MeasurementSchemaEntry {
    string name = 1;
    repeated string tag_keys = 2;
    repeated MeasurementSchemaField fields = 3;
}

message MeasurementSchemaField {
    string name = 1;
    sint32 typ = 2;
}
